on:
  push:
    branches:
      - main
      - Marbin--main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'Win64'
        type: choice
        options:
          - Win64
          - Linux
      config:
        description: 'Build configuration'
        required: true
        default: 'Shipping'
        type: choice
        options:
          - Shipping
          - Development
          - Debug

jobs:
  build:
    runs-on: docker
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BUILD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 192.168.1.43 >> ~/.ssh/known_hosts

      - name: Trigger build
        run: |
          FOLDER_NAME="${{ github.ref_name }}"
          REPO="${{ github.server_url }}/${{ github.repository }}.git"
          FOLDER="${{ github.repository }}"
          PLATFORM="${{ github.event.inputs.platform || 'Win64' }}"
          CONFIG="${{ github.event.inputs.config || 'Shipping' }}"
          ssh Administrator@192.168.1.43 "C:\Users\Administrator\Desktop\runUE.bat $FOLDER_NAME $REPO $FOLDER $PLATFORM $CONFIG"
      - name: Move Build
        run: |
          FOLDER_NAME="${{ github.ref_name }}"
          REPO="${{ github.server_url }}/${{ github.repository }}.git"
          FOLDER="${{ github.repository }}"
          ssh Administrator@192.168.1.43 "C:\Users\Administrator\Desktop\Move.bat $FOLDER_NAME $REPO $FOLDER"